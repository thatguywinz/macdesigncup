<!doctype html>
<!--
  The 1200x630 social card (public/og-image.png), in the site's quiet look:
  the near-black page, the name set like a section heading (Archivo 600,
  sentence case), one grey line for when and where, the prize pool in
  ember, and the lion with the hall's one warm light behind it. No grid,
  no mono labels. No stock, no AI.
  Rendered by scripts/og/render.mjs, which fills every double-brace slot from
  src/config/site.ts + src/content/copy.ts (via the SSR bundle) and inlines
  the font and the lion as data URIs.
-->
<html lang="en-CA">
<head>
<meta charset="UTF-8" />
<style>
  @font-face { font-family: "Archivo"; src: url({{fontArchivo}}) format("woff2"); font-weight: 100 900; }

  :root {
    --bg: #090a0c;
    --bone: 42 38% 86%;
    --ember: 24 100% 54%;
    --concrete: 220 5% 62%;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; background: var(--bg); overflow: hidden; }
  body { position: relative; color: hsl(var(--bone)); font-family: "Archivo", sans-serif; }

  /* The hall's one warm source, behind the lion. */
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(30% 48% at 79% 50%, hsl(var(--ember) / 0.14), transparent 70%);
  }

  .copy { position: absolute; left: 88px; top: 0; bottom: 0; width: 660px; display: flex; flex-direction: column; justify-content: center; }
  h1 {
    font-weight: 600; font-size: 92px; line-height: 1.02; letter-spacing: -0.03em;
    color: hsl(var(--bone));
  }
  .when { margin-top: 30px; font-size: 28px; line-height: 1.35; color: hsl(var(--concrete)); }
  .prize { margin-top: 14px; font-size: 28px; font-weight: 500; color: hsl(var(--ember)); }

  .mark { position: absolute; left: 810px; top: 165px; width: 300px; height: 300px; }
</style>
</head>
<body>
  <div class="glow"></div>

  <div class="copy">
    <h1>{{h1a}}<br />{{h1b}}</h1>
    <p class="when">{{date}} · {{venue}}</p>
    <p class="prize">{{prize}}</p>
  </div>

  <img class="mark" src="{{lion}}" alt="" />
</body>
</html>
